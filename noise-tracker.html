<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🤫 2-7 정숙 모드 (소음 측정기)</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            var(--text-white: #ffffff);
            var(--text-yellow: #ffeaa7);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow: hidden; /* 팝업 형태이므로 스크롤 막음 */
            -webkit-user-select: none; user-select: none;
        }

        /* ✨ 데시벨 단계별 동적 배경색 설정 */
        .bg-level-1 { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); } /* < 40dB: 조용함 (파랑) */
        .bg-level-2 { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); } /* 40~49dB: 약간 소음 (초록) */
        .bg-level-3 { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); } /* 50~59dB: 시끄러움 주의 (주황) */
        .bg-level-4 { 
            background: rgba(231, 76, 60, 0.95); /* >= 60dB: 경고 (빨강) */
            animation: siren-glow 1s infinite alternate; 
        }

        /* 메인 컨테이너 */
        .app-wrapper {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #ffffff;
            transition: background 0.8s ease; /* 배경색이 부드럽게 바뀌도록 설정 */
            text-shadow: 0 10px 20px rgba(0,0,0,0.3); 
        }

        .status-emoji {
            width: 8rem; height: 8rem;
            margin-bottom: 20px;
            object-fit: contain;
        }
        
        .float { animation: float 2s infinite ease-in-out; }
        .spin { animation: spin 2s infinite linear; }

        .main-title {
            font-size: 3.5rem; font-weight: 900;
            margin: 0 0 30px 0; letter-spacing: -1px;
            color: #ffeaa7;
        }

        .db-text {
            font-size: 8rem; font-weight: 900;
            margin: 20px 0; letter-spacing: 2px;
        }

        .dashboard-btn {
            display: flex; align-items: center; gap: 8px;
            color: #2c3e50; background: white;
            border: none; border-radius: 50px;
            font-size: 1.6rem; font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.2s;
            margin: 10px;
            outline: none;
        }
        .dashboard-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .dashboard-btn:not(:disabled):active { transform: scale(0.95); } 

        @keyframes siren-glow { 
            from { box-shadow: inset 0 0 50px rgba(192, 57, 43, 0.5); } 
            to { box-shadow: inset 0 0 200px rgba(192, 57, 43, 1); } 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-wrapper bg-level-1" id="main-wrapper">
        
        <img id="status-icon" class="status-emoji float" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Shushing%20face/3D/shushing_face_3d.png" alt="🤫">
        <h1 class="main-title">조용히 공부합시다</h1>
        <div id="db-display" class="db-text">0 dB</div>
        
        <div style="margin-top: 50px; display:flex;">
            <button id="start-btn" class="dashboard-btn" style="padding: 20px 40px;">
                측정 시작 <span style="font-size: 1.8rem;">🎙️</span>
            </button>
            <button id="stop-btn" class="dashboard-btn" style="padding: 20px 40px;" disabled>
                측정 종료 <span style="font-size: 1.8rem;">🛑</span>
            </button>
        </div>
    </div>

    <audio id="siren-sound" src="siren.mp3" loop></audio>

<script>
        // --- [설정 세팅] ---
        const THRESHOLD = 60;        // 경고 데시벨 기준치
        const ALERT_GAP = 180000;    // 자동 알림 쿨타임 (3분 = 180000ms)
        const DURATION_LIMIT = 3000; // ✨ 3초(3000ms) 이상 지속되어야 경고 발동!
        const DASHBOARD_SERVER_URL = "https://script.google.com/macros/s/AKfycbxJCsXcX9o4TcrLxNBTgQDzG6nk0i2MRE51tIPr0FXe6dYDisoRvjlhULk39UEs5LEgHg/exec";

        const EMOJI_SHUSH = "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Shushing%20face/3D/shushing_face_3d.png";
        const EMOJI_SIREN = "https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Police%20car%20light/3D/police_car_light_3d.png";

        let audioContext;
        let analyser;
        let microphone;
        let javascriptNode;
        let isRecording = false;
        let lastAlertTime = 0; 
        let isWarningMode = false; 
        let overThresholdStartTime = 0; // ✨ 기준치 초과가 시작된 시간 기록용 변수

        const wrapper = document.getElementById('main-wrapper');
        const iconEl = document.getElementById('status-icon');
        const dbDisplay = document.getElementById('db-display');
        const sirenSound = document.getElementById('siren-sound');
        const startBtn = document.getElementById('start-btn');
        const stopBtn = document.getElementById('stop-btn');

        startBtn.addEventListener('click', startMonitoring);
        stopBtn.addEventListener('click', stopMonitoring);

        async function startMonitoring() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                microphone = audioContext.createMediaStreamSource(stream);
                javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);

                analyser.smoothingTimeConstant = 0.8;
                analyser.fftSize = 1024;

                microphone.connect(analyser);
                analyser.connect(javascriptNode);
                javascriptNode.connect(audioContext.destination);

                isRecording = true;
                startBtn.disabled = true;
                stopBtn.disabled = false;

                javascriptNode.onaudioprocess = () => {
                    if(!isRecording) return;
                    const array = new Uint8Array(analyser.frequencyBinCount);
                    analyser.getByteFrequencyData(array);
                    
                    let values = 0;
                    for (let i = 0; i < array.length; i++) { values += array[i]; }
                    const decibel = Math.round(values / array.length); 

                    dbDisplay.innerText = decibel + " dB";
                    updateBackgroundColor(decibel);

                    // ✨ 지속 시간 체크 로직 추가
                    if (decibel >= THRESHOLD) {
                        if (overThresholdStartTime === 0) {
                            // 처음으로 60dB을 넘은 순간의 시간을 기록
                            overThresholdStartTime = Date.now(); 
                        } else if (Date.now() - overThresholdStartTime >= DURATION_LIMIT) {
                            // 60dB 넘은 상태가 3초(DURATION_LIMIT) 이상 유지되면 드디어 경고!
                            triggerAlarm(); 
                        }
                    } else {
                        // 60dB 밑으로 떨어지면 시간 기록 초기화 및 알람 중지
                        overThresholdStartTime = 0; 
                        stopAlarm();    
                    }
                };
            } catch (err) {
                alert('마이크 접근 권한이 필요합니다. 브라우저 설정을 확인해주세요.');
                console.error(err);
            }
        }

        function stopMonitoring() {
            if (audioContext) audioContext.close();
            isRecording = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;
            overThresholdStartTime = 0; // 종료 시 초기화
            stopAlarm(); 
            dbDisplay.innerText = "0 dB";
            updateBackgroundColor(0); 
        }

        function updateBackgroundColor(db) {
            wrapper.classList.remove('bg-level-1', 'bg-level-2', 'bg-level-3', 'bg-level-4');
            
            if (db >= THRESHOLD) {
                wrapper.classList.add('bg-level-4'); 
            } else if (db >= 50) {
                wrapper.classList.add('bg-level-3'); 
            } else if (db >= 40) {
                wrapper.classList.add('bg-level-2'); 
            } else {
                wrapper.classList.add('bg-level-1'); 
            }
        }

        function triggerAlarm() {
            if (isWarningMode) return; 
            isWarningMode = true;

            iconEl.src = EMOJI_SIREN;
            iconEl.classList.remove('float');
            iconEl.classList.add('spin'); 

            if (sirenSound.paused) {
                sirenSound.play().catch(err => console.log("소리 재생 차단됨:", err));
            }
            
            const now = Date.now();
            if (now - lastAlertTime > ALERT_GAP) {
                sendTeacherAlert();
                lastAlertTime = now;
            }
        }

        function stopAlarm() {
            if (!isWarningMode) return; 
            isWarningMode = false;

            iconEl.src = EMOJI_SHUSH;
            iconEl.classList.remove('spin');
            iconEl.classList.add('float'); 

            sirenSound.pause();
            sirenSound.currentTime = 0;
        }

        function sendTeacherAlert() {
            console.log("선생님께 알림 전송 로직 호출...");

            const webhookUrl = "https://chat.googleapis.com/v1/spaces/AAQA5wh_Zy0/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=vC9X63QQ4FuDBIEFfn3ryIJSTEGem-z1bM-OSh4W3cQ";
            
            const chatPayload = {
                "text": "🚨 *[자습 모드 소음 경고]*\n2학년 7반 교실의 소음이 기준치(60dB)를 3초 이상 초과했습니다! 🤫\n정숙 지도가 필요합니다."
            };

            fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(chatPayload)
            })
            .then(res => console.log("✅ 구글 챗 알림 전송 완료"))
            .catch(err => console.error("❌ 구글 챗 알림 전송 실패:", err));

            // 대시보드 팝업을 원치 않으시면 아래 블록을 통째로 주석 처리(/* ~ */) 하시면 됩니다.
            /*
            if (!DASHBOARD_SERVER_URL || DASHBOARD_SERVER_URL.includes("발급받은")) return;

            const messageText = `[공지] 🤫 2학년 7반 교실 소음이 기준치를 넘었습니다! 집중합시다.`;
            
            fetch(`${DASHBOARD_SERVER_URL}?action=call&name=${encodeURIComponent(messageText)}`)
                .then(res => {
                    if (res.ok) console.log("✅ 대시보드 긴급 팝업 전송 완료");
                })
                .catch(error => console.error('통신 오류:', error));
            */
        }
    </script>
</body>
</html>
