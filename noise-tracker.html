<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>🤫 2-7 정숙 모드 (소음 측정기)</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
    <style>
        :root {
            var(--text-white: #ffffff);
            var(--text-yellow: #ffeaa7);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Pretendard', -apple-system, sans-serif;
            overflow: hidden; /* 팝업 형태이므로 스크롤 막음 */
            -webkit-user-select: none; user-select: none;
        }

        /* ✨ 데시벨 단계별 동적 배경색 설정 */
        .bg-level-1 { background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); } /* < 40dB: 조용함 (파랑) */
        .bg-level-2 { background: linear-gradient(135deg, #2ecc71 0%, #27ae60 100%); } /* 40~49dB: 약간 소음 (초록) */
        .bg-level-3 { background: linear-gradient(135deg, #f39c12 0%, #d35400 100%); } /* 50~59dB: 시끄러움 주의 (주황) */
        .bg-level-4 { 
            background: rgba(231, 76, 60, 0.95); /* >= 60dB: 경고 (빨강) */
            animation: siren-glow 1s infinite alternate; 
        }

        /* 메인 컨테이너 */
        .app-wrapper {
            width: 100vw; height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            color: #ffffff;
            transition: background 0.8s ease; /* 배경색이 부드럽게 바뀌도록 설정 */
            text-shadow: 0 10px 20px rgba(0,0,0,0.3); 
        }

        .status-emoji {
            width: 8rem; height: 8rem;
            margin-bottom: 20px;
            object-fit: contain;
        }
        
        .float { animation: float 2s infinite ease-in-out; }
        .spin { animation: spin 2s infinite linear; }

        .main-title {
            font-size: 3.5rem; font-weight: 900;
            margin: 0 0 30px 0; letter-spacing: -1px;
            color: #ffeaa7;
        }

        .db-text {
            font-size: 8rem; font-weight: 900;
            margin: 20px 0; letter-spacing: 2px;
        }

        .dashboard-btn {
            display: flex; align-items: center; gap: 8px;
            color: #2c3e50; background: white;
            border: none; border-radius: 50px;
            font-size: 1.6rem; font-weight: 900;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.2s;
            margin: 10px;
            outline: none;
        }
        .dashboard-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .dashboard-btn:not(:disabled):active { transform: scale(0.95); } 

        @keyframes siren-glow { 
            from { box-shadow: inset 0 0 50px rgba(192, 57, 43, 0.5); } 
            to { box-shadow: inset 0 0 200px rgba(192, 57, 43, 1); } 
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-15px); } 100% { transform: translateY(0px); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="app-wrapper bg-level-1" id="main-wrapper">
        
        <img id="status-icon" class="status-emoji float" src="https://cdn.jsdelivr.net/gh/microsoft/fluentui-emoji@main/assets/Shushing%20face/3D/shushing_face_3d.png" alt="🤫">
        <h1 class="main-title">조용히 공부합시다</h1>
        <div id="db-display" class="db-text">0 dB</div>
        
        <div style="margin-top: 50px; display:flex;">
            <button id="start-btn" class="dashboard-btn" style="padding: 20px 40px;">
                측정 시작 <span style="font-size: 1.8rem;">🎙️</span>
            </button>
            <button id="stop-btn" class="dashboard-btn" style="padding: 20px 40px;" disabled>
                측정 종료 <span style="font-size: 1.8rem;">🛑</span>
            </button>
        </div>
    </div>

    <audio id="siren-sound" src="siren.mp3" loop></audio>
